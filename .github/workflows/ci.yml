name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enigma
          POSTGRES_PASSWORD: enigma_local_only
          POSTGRES_DB: enigma
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://enigma:enigma_local_only@localhost:5434/enigma
          DB_PASSWORD: enigma_local_only
          FINANCE_SOURCE: fixture
          AI_PROVIDER: offline
          AI_OFFLINE_FALLBACK: "true"
        run: |
          pytest tests/ -v
